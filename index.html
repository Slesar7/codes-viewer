<!-- codes.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Активные коды</title>
  <style>
    body { font-family: sans-serif; padding: 1em; background: #f8f8f8; }
    h1 { font-size: 1.4em; }
    ul { padding-left: 1.2em; }
    li { margin: 0.4em 0; font-size: 1.1em; }
  </style>
</head>
<body>
  <h1>Активные коды:</h1>
  <ul id="codes-list"></ul>

  <script>
    async function loadCodes() {
      const res = await fetch("http://localhost:8080/codes");
      const data = await res.json();
      const list = document.getElementById("codes-list");
      list.innerHTML = "";
      data.codes.forEach(code => {
        const li = document.createElement("li");
        li.textContent = code;
        list.appendChild(li);
      });
    }

    loadCodes();
    setInterval(loadCodes, 5000); // обновлять каждые 5 секунд
  </script>
</body>
</html>
